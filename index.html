<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>옴의 법칙 탐구 (학생용)</title>
  <!-- Tailwind CSS & Chart.js CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-bolt text-amber-300 text-2xl"></i>
        <h1 class="text-xl md:text-2xl font-bold">옴의 법칙 탐구 가상 실험실</h1>
        <!-- Firebase Status Badge -->
        <span id="dbStatusBadge" class="text-xs px-2.5 py-1 rounded-full bg-amber-500/80 text-white font-medium flex items-center gap-1.5 ml-2">
          <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> DB 연결 확인 중
        </span>
      </div>
      <!-- 교사 탭 전환 버튼 제거됨 -->
    </div>
  </header>

  <!-- ==================== 학생용 탐구 화면 ==================== -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full flex-1">

    <!-- Left Column: Controls & Circuit Canvas -->
    <section class="lg:col-span-7 flex flex-col gap-6">
      
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-sliders text-indigo-600"></i> 회로 조건 및 변수 조작
          </h2>
          <div class="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-lg text-sm">
            <span class="font-medium text-slate-600">내 모둠:</span>
            <select id="groupSelect" onchange="checkCurrentGroupSubmissionStatus()" class="bg-white font-bold text-indigo-600 rounded px-2 py-0.5 border border-slate-200">
              <option value="1">1 모둠</option>
              <option value="2">2 모둠</option>
              <option value="3">3 모둠</option>
              <option value="4">4 모둠</option>
              <option value="5">5 모둠</option>
              <option value="6">6 모둠</option>
            </select>
          </div>
        </div>

        <!-- Circuit Mode Selector -->
        <div class="grid grid-cols-3 gap-2 mb-5">
          <button onclick="setCircuitType('single')" id="btn-single" class="circuit-btn py-2.5 px-3 text-sm font-semibold rounded-lg border text-center transition-all bg-indigo-600 text-white border-indigo-600 shadow-sm">
            단일 저항
          </button>
          <button onclick="setCircuitType('series')" id="btn-series" class="circuit-btn py-2.5 px-3 text-sm font-semibold rounded-lg border text-center transition-all bg-white text-slate-700 border-slate-300 hover:bg-slate-50">
            직렬 연결 🔗
          </button>
          <button onclick="setCircuitType('parallel')" id="btn-parallel" class="circuit-btn py-2.5 px-3 text-sm font-semibold rounded-lg border text-center transition-all bg-white text-slate-700 border-slate-300 hover:bg-slate-50">
            병렬 연결 🌿
          </button>
        </div>

        <!-- Sliders -->
        <div class="space-y-4">
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-sm font-medium text-slate-700">전압 (V)</label>
              <span id="vVal" class="text-indigo-600 font-bold text-lg">6.0 V</span>
            </div>
            <input type="range" id="vRange" min="1" max="12" step="0.5" value="6" oninput="updateCircuit()" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label id="r1Label" class="text-sm font-medium text-slate-700">저항 (R)</label>
              <span id="r1Val" class="text-amber-600 font-bold text-lg">10 Ω</span>
            </div>
            <input type="range" id="r1Range" min="2" max="30" step="1" value="10" oninput="updateCircuit()" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-amber-600">
          </div>

          <div id="r2Container" class="hidden">
            <div class="flex justify-between items-center mb-1">
              <label class="text-sm font-medium text-slate-700">저항 2 (R2)</label>
              <span id="r2Val" class="text-emerald-600 font-bold text-lg">10 Ω</span>
            </div>
            <input type="range" id="r2Range" min="2" max="30" step="1" value="10" oninput="updateCircuit()" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600">
          </div>
        </div>

        <!-- Calculated Values Cards -->
        <div class="grid grid-cols-3 gap-3 mt-5 pt-4 border-t border-slate-100 text-center">
          <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-100">
            <div class="text-xs text-indigo-600 font-medium mb-0.5">전압 (V)</div>
            <div id="calcV" class="text-base font-extrabold text-indigo-700">6.0 V</div>
          </div>
          <div class="bg-amber-50 p-2.5 rounded-lg border border-amber-100">
            <div class="text-xs text-amber-600 font-medium mb-0.5">합성 저항 (R_total)</div>
            <div id="calcR" class="text-base font-extrabold text-amber-700">10.0 Ω</div>
          </div>
          <div class="bg-rose-50 p-2.5 rounded-lg border border-rose-100">
            <div class="text-xs text-rose-600 font-medium mb-0.5">전체 전류 (I)</div>
            <div id="calcI" class="text-base font-extrabold text-rose-700">0.60 A</div>
          </div>
        </div>
      </div>

      <!-- Canvas Circuit -->
      <div class="bg-slate-900 rounded-xl shadow-sm p-4 border border-slate-800 text-white flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-2 px-2">
          <span class="text-xs font-semibold text-slate-400 flex items-center gap-1.5">
            <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> 실시간 회로 애니메이션 (전자 흐름)
          </span>
          <span id="branchCurrentInfo" class="text-xs text-cyan-300 font-mono"></span>
        </div>
        <canvas id="circuitCanvas" width="550" height="230" class="w-full max-w-full bg-slate-950 rounded-lg border border-slate-800"></canvas>
      </div>

      <button onclick="recordData()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-base">
        <i class="fa-solid fa-plus-circle"></i> 현재 측정 데이터 수집하기
      </button>

    </section>

    <!-- Right Column: Dynamic Multi-Point Chart & Submission Box -->
    <section class="lg:col-span-5 flex flex-col gap-6">

      <!-- Dynamic Graph Card -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-md font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-line text-indigo-600"></i> 실시간 V-I 측정 데이터 그래프
          </h2>
          <span id="pointCountTag" class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-semibold">측정점: 0개</span>
        </div>
        <p class="text-[11px] text-slate-500 mb-3">※ 측정 데이터를 2개 이상 수집하면 지점들을 연결하는 수집 데이터 그래프가 생성됩니다.</p>
        <div class="h-56 relative w-full">
          <canvas id="simChart"></canvas>
        </div>
      </div>

      <!-- Data Table -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-md font-bold text-slate-800 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-table text-indigo-600"></i> 수집된 데이터 목록
        </h2>
        <div class="overflow-x-auto max-h-36">
          <table class="w-full text-xs text-left text-slate-600">
            <thead class="text-xs text-slate-700 uppercase bg-slate-100 sticky top-0">
              <tr>
                <th class="px-2 py-2">연결</th>
                <th class="px-2 py-2">전압</th>
                <th class="px-2 py-2">저항</th>
                <th class="px-2 py-2">전류</th>
                <th class="px-2 py-2 text-right">삭제</th>
              </tr>
            </thead>
            <tbody id="dataTableBody">
              <tr><td colspan="5" class="text-center py-4 text-slate-400">수집된 데이터가 없습니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Firebase Submission Box -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <h2 class="text-md font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-paper-plane text-indigo-600"></i> 모둠 데이터 Firebase 전송
          </h2>
          <span id="studentSubmissionStatus" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 font-semibold">
            🔴 미제출
          </span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">작성자 / 모둠원 이름</label>
          <input type="text" id="studentName" placeholder="예: 김과학, 이탐구" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">옴의 법칙 결론 및 그래프 해석</label>
          <textarea id="groupConclusion" rows="3" placeholder="수집된 점들과 그래프 해석을 바탕으로 설명해보세요." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <button onclick="submitToFirebase()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition-all text-sm flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Firebase DB로 최종 제출하기
        </button>
      </div>

    </section>
  </main>

  <!-- Firebase 연동 스크립트 (학생용: 데이터 쓰기 및 상태 확인 전용) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBwVd1wiSjC0P1aSYvt_gO95YzTi16reSo", // Firebase 식별용 공개키 (안전)
      authDomain: "ejje-d0631.firebaseapp.com",
      projectId: "ejje-d0631",
      storageBucket: "ejje-d0631.firebasestorage.app",
      messagingSenderId: "987473333769",
      appId: "1:987473333769:web:ba2def7c500e79453472d8",
      measurementId: "G-09SQQD9TL1",
      databaseURL: "https://ejje-d0631-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const rtdb = firebase.database();
    const firestore = firebase.firestore();

    // 임시 캐시용 객체
    window.groupSubmissions = {};

    function initFirebaseSync() {
      const badge = document.getElementById('dbStatusBadge');

      rtdb.ref('groups').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          window.groupSubmissions = data;
          if (badge) {
            badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500 text-white font-medium flex items-center gap-1.5 ml-2";
            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-white"></span> Realtime DB 연결됨`;
          }
          checkCurrentGroupSubmissionStatus();
        }
      });
    }

    function checkCurrentGroupSubmissionStatus() {
      const currentGroup = document.getElementById('groupSelect').value;
      const statusBadge = document.getElementById('studentSubmissionStatus');
      const data = window.groupSubmissions[currentGroup];

      if (data && data.name && data.name !== "") {
        const timeStr = data.submittedAt ? new Date(data.submittedAt).toLocaleTimeString() : '';
        statusBadge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold border border-emerald-300";
        statusBadge.innerHTML = `🟢 제출 완료 ${timeStr ? '(' + timeStr + ')' : ''}`;
      } else {
        statusBadge.className = "text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-600 font-bold border border-rose-200";
        statusBadge.innerHTML = `🔴 미제출`;
      }
    }

    function submitToFirebase() {
      const groupNum = document.getElementById('groupSelect').value;
      const studentName = document.getElementById('studentName').value.trim();
      const conclusion = document.getElementById('groupConclusion').value.trim();

      if (!studentName || !conclusion) {
        showNotification('학생 이름과 토론 결론을 작성해주세요.');
        return;
      }

      const { rTotal, iTotal } = calculateCircuit();
      const typeLabel = window.circuitType === 'single' ? '단일' : (window.circuitType === 'series' ? '직렬' : '병렬');

      // 재제출 시 기존 교사 피드백이 있다면 보존
      const existingFeedback = window.groupSubmissions[groupNum]?.feedback || "";

      const payload = {
        name: `${groupNum}모둠 (${studentName})`,
        circuit: typeLabel,
        v: window.currentV,
        r: parseFloat(rTotal.toFixed(1)),
        i: parseFloat(iTotal.toFixed(2)),
        points: collectedData.map(d => ({ x: parseFloat(d.v), y: parseFloat(d.i) })),
        conclusion: conclusion,
        feedback: existingFeedback,
        submittedAt: new Date().toISOString()
      };

      // Realtime Database 및 Firestore 데이터 저장
      Promise.all([
        rtdb.ref('groups/' + groupNum).set(payload),
        firestore.collection('groups').doc(groupNum).set(payload)
      ]).then(() => {
        showNotification(`${groupNum}모둠 데이터 제출이 완료되었습니다!`);
      }).catch((err) => {
        showNotification("데이터 전송 중 오류가 발생했습니다.");
      });
    }
  </script>

  <!-- 앱 및 차트 로직 스크립트 -->
  <script>
    window.circuitType = 'single';
    window.currentV = 6.0;
    window.currentR1 = 10.0;
    window.currentR2 = 10.0;
    let collectedData = [];
    let electronParticles = [];
    let simChartInstance = null;

    function showNotification(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 right-5 bg-slate-800 text-white text-sm px-4 py-3 rounded-xl shadow-lg z-50 transition-opacity duration-300';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function calculateCircuit() {
      let rTotal = window.currentR1;
      let i1 = 0, i2 = 0;

      if (window.circuitType === 'single') {
        rTotal = window.currentR1;
        i1 = window.currentV / window.currentR1;
      } else if (window.circuitType === 'series') {
        rTotal = window.currentR1 + window.currentR2;
        i1 = window.currentV / rTotal;
        i2 = i1;
      } else if (window.circuitType === 'parallel') {
        rTotal = (window.currentR1 * window.currentR2) / (window.currentR1 + window.currentR2);
        i1 = window.currentV / window.currentR1;
        i2 = window.currentV / window.currentR2;
      }

      const iTotal = window.currentV / rTotal;
      return { rTotal, iTotal, i1, i2 };
    }

    function setCircuitType(type) {
      window.circuitType = type;
      document.querySelectorAll('.circuit-btn').forEach(btn => {
        btn.className = 'circuit-btn py-2.5 px-3 text-sm font-semibold rounded-lg border text-center transition-all bg-white text-slate-700 border-slate-300 hover:bg-slate-50';
      });
      document.getElementById(`btn-${type}`).className = 'circuit-btn py-2.5 px-3 text-sm font-semibold rounded-lg border text-center transition-all bg-indigo-600 text-white border-indigo-600 shadow-sm';

      const r2Container = document.getElementById('r2Container');
      const r1Label = document.getElementById('r1Label');

      if (type === 'single') {
        r2Container.classList.add('hidden');
        r1Label.innerText = '저항 (R)';
      } else {
        r2Container.classList.remove('hidden');
        r1Label.innerText = '저항 1 (R1)';
      }
      initElectrons();
      updateCircuit();
    }

    function updateCircuit() {
      window.currentV = parseFloat(document.getElementById('vRange').value);
      window.currentR1 = parseFloat(document.getElementById('r1Range').value);
      window.currentR2 = parseFloat(document.getElementById('r2Range').value);

      document.getElementById('vVal').innerText = window.currentV.toFixed(1) + ' V';
      document.getElementById('r1Val').innerText = window.currentR1.toFixed(0) + ' Ω';
      document.getElementById('r2Val').innerText = window.currentR2.toFixed(0) + ' Ω';

      const { rTotal, iTotal, i1, i2 } = calculateCircuit();

      document.getElementById('calcV').innerText = window.currentV.toFixed(1) + ' V';
      document.getElementById('calcR').innerText = rTotal.toFixed(1) + ' Ω';
      document.getElementById('calcI').innerText = iTotal.toFixed(2) + ' A';

      const branchInfo = document.getElementById('branchCurrentInfo');
      if (window.circuitType === 'parallel') {
        branchInfo.innerText = `가지전류: I1 = ${i1.toFixed(2)}A, I2 = ${i2.toFixed(2)}A`;
      } else {
        branchInfo.innerText = '';
      }

      updateChart(window.currentV, iTotal, rTotal);
    }

    function initChart() {
      const ctx = document.getElementById('simChart').getContext('2d');
      simChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: '수집 데이터 연결선',
              data: [],
              borderColor: '#a855f7',
              borderWidth: 2,
              borderDash: [4, 4],
              fill: false,
              tension: 0.1
            },
            {
              label: '수집 데이터 지점들',
              data: [],
              backgroundColor: '#a855f7',
              borderColor: '#ffffff',
              borderWidth: 2,
              pointRadius: 6,
              pointHoverRadius: 8,
              showLine: false
            },
            {
              label: '이론상 V-I 경향선',
              data: [],
              borderColor: '#cbd5e1',
              borderWidth: 1.5,
              fill: false,
              pointRadius: 0
            },
            {
              label: '실시간 조작 위치',
              data: [],
              backgroundColor: '#f97316',
              borderColor: '#ffffff',
              borderWidth: 2,
              pointRadius: 8
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { type: 'linear', title: { display: true, text: '전압 V (Volt)' }, min: 0, max: 13 },
            y: { title: { display: true, text: '전류 I (Ampere)' }, min: 0, max: 3 }
          }
        }
      });
    }

    function updateChart(v, i, rTotal) {
      if (!simChartInstance) return;

      const curvePoints = [];
      for (let x = 0; x <= 12; x += 0.5) {
        curvePoints.push({ x: x, y: x / rTotal });
      }

      const sortedCollectedPoints = collectedData
        .map(d => ({ x: parseFloat(d.v), y: parseFloat(d.i) }))
        .sort((a, b) => a.x - b.x);

      simChartInstance.data.datasets[0].data = sortedCollectedPoints.length >= 2 ? sortedCollectedPoints : [];
      simChartInstance.data.datasets[1].data = sortedCollectedPoints;
      simChartInstance.data.datasets[2].data = curvePoints;
      simChartInstance.data.datasets[3].data = [{ x: v, y: i }];

      document.getElementById('pointCountTag').innerText = `측정점: ${sortedCollectedPoints.length}개`;
      simChartInstance.update('none');
    }

    function recordData() {
      const { rTotal, iTotal } = calculateCircuit();
      const typeLabel = window.circuitType === 'single' ? '단일' : (window.circuitType === 'series' ? '직렬' : '병렬');
      
      const entry = { id: Date.now(), type: typeLabel, v: window.currentV, r: rTotal.toFixed(1), i: iTotal.toFixed(2) };
      collectedData.push(entry);
      renderTable();
      updateCircuit();
      showNotification(`새 측정 지점이 수집되었습니다. (총 ${collectedData.length}개)`);
    }

    function deleteData(id) {
      collectedData = collectedData.filter(item => item.id !== id);
      renderTable();
      updateCircuit();
    }

    function renderTable() {
      const tbody = document.getElementById('dataTableBody');
      if (collectedData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-slate-400">수집된 데이터가 없습니다.</td></tr>';
        return;
      }
      tbody.innerHTML = collectedData.map(item => `
        <tr class="border-b border-slate-100 hover:bg-slate-50">
          <td class="px-2 py-2 font-medium">${item.type}</td>
          <td class="px-2 py-2">${item.v} V</td>
          <td class="px-2 py-2">${item.r} Ω</td>
          <td class="px-2 py-2 font-bold text-indigo-600">${item.i} A</td>
          <td class="px-2 py-2 text-right">
            <button onclick="deleteData(${item.id})" class="text-rose-500 hover:text-rose-700">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // Circuit Animation Setup
    function initElectrons() {
      electronParticles = [];
      for (let i = 0; i < 24; i++) {
        electronParticles.push({ progress: i / 24, branch: i % 2 === 0 ? 1 : 2 });
      }
    }

    function drawCircuit() {
      const canvas = document.getElementById('circuitCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);
      const { iTotal } = calculateCircuit();
      const speed = iTotal * 0.008;

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 4;

      if (window.circuitType === 'parallel') {
        ctx.beginPath();
        ctx.moveTo(100, h / 2); ctx.lineTo(175, h / 2);
        ctx.moveTo(175, 60); ctx.lineTo(375, 60);
        ctx.moveTo(175, 170); ctx.lineTo(375, 170);
        ctx.moveTo(175, 60); ctx.lineTo(175, 170);
        ctx.moveTo(375, 60); ctx.lineTo(375, 170);
        ctx.moveTo(375, h / 2); ctx.lineTo(450, h / 2);
        ctx.moveTo(450, h / 2); ctx.lineTo(450, 200); ctx.lineTo(100, 200); ctx.lineTo(100, h / 2);
        ctx.stroke();

        ctx.fillStyle = '#22d3ee';
        ctx.beginPath(); ctx.arc(175, h / 2, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(375, h / 2, 5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.rect(100, 50, 350, 140);
        ctx.stroke();
      }

      ctx.fillStyle = '#ef4444'; ctx.fillRect(85, 105, 10, 30);
      ctx.fillStyle = '#3b82f6'; ctx.fillRect(105, 112, 6, 16);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('DC', 85, 95);

      if (window.circuitType === 'single') {
        drawResistor(ctx, 250, 50, `R = ${window.currentR1}Ω`);
      } else if (window.circuitType === 'series') {
        drawResistor(ctx, 200, 50, `R1 = ${window.currentR1}Ω`);
        drawResistor(ctx, 320, 50, `R2 = ${window.currentR2}Ω`);
      } else if (window.circuitType === 'parallel') {
        drawResistor(ctx, 275, 60, `R1 = ${window.currentR1}Ω`);
        drawResistor(ctx, 275, 170, `R2 = ${window.currentR2}Ω`);
      }

      ctx.fillStyle = '#38bdf8';
      electronParticles.forEach(p => {
        p.progress = (p.progress + speed) % 1;
        let pos = getElectronPosition(p.progress, p.branch);
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(drawCircuit);
    }

    function drawResistor(ctx, x, y, label) {
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(x - 25, y - 10, 50, 20);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 25, y - 10, 50, 20);

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y - 15);
    }

    function getElectronPosition(progress, branch) {
      if (window.circuitType === 'parallel') {
        const totalLen = 700;
        let d = progress * totalLen;
        if (d < 75) return { x: 100 + d, y: 115 };
        d -= 75;
        if (d < 55) return { x: 175, y: branch === 1 ? 115 - (d / 55) * 55 : 115 + (d / 55) * 55 };
        d -= 55;
        if (d < 200) return { x: 175 + d, y: branch === 1 ? 60 : 170 };
        d -= 200;
        if (d < 55) return { x: 375, y: branch === 1 ? 60 + (d / 55) * 55 : 170 - (d / 55) * 55 };
        d -= 55;
        if (d < 75) return { x: 375 + d, y: 115 };
        d -= 75;
        if (d < 75) return { x: 450, y: 115 + (d / 75) * 75 };
        d -= 75;
        if (d < 350) return { x: 450 - d, y: 190 };
        return { x: 100, y: 190 - (d - 350) };
      } else {
        const totalLen = 980;
        let d = progress * totalLen;
        if (d < 350) return { x: 100 + d, y: 50 };
        d -= 350;
        if (d < 140) return { x: 450, y: 50 + d };
        d -= 140;
        if (d < 350) return { x: 450 - d, y: 190 };
        d -= 350;
        return { x: 100, y: 190 - d };
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initChart();
      initElectrons();
      updateCircuit();
      initFirebaseSync();
      requestAnimationFrame(drawCircuit);
    });
  </script>
</body>
</html>
